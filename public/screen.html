<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porównanie Figma ↔ Live — SupportME</title>
<style>
  :root{ --bg:#0e1726; --panel:#16223a; --ink:#e8eef7; --muted:#9fb0c8; --accent:#3a9bff; --line:#26344f; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif; }
  header{ padding:22px 28px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(14,23,38,.93); backdrop-filter:blur(8px); z-index:30; }
  h1{ margin:0 0 4px; font-size:20px; }
  .sub{ color:var(--muted); font-size:13px; }
  .wrap{ max-width:1560px; margin:0 auto; padding:22px 28px 90px; }
  .tabs{ display:flex; gap:8px; margin:8px 0 4px; flex-wrap:wrap; }
  .tab{ background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:9px 16px; border-radius:999px; cursor:pointer; font-size:14px; }
  .tab.active{ background:var(--accent); border-color:var(--accent); color:#021223; font-weight:600; }
  .screen{ display:none; }
  .screen.active{ display:block; }
  .block{ margin-top:30px; }
  .block h2{ font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .toolbar{ display:flex; align-items:center; gap:16px; margin:10px 0 16px; flex-wrap:wrap; }
  .seg{ display:flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button{ background:transparent; border:0; color:var(--ink); padding:8px 14px; cursor:pointer; font-size:13px; }
  .seg button.active{ background:var(--accent); color:#021223; font-weight:600; }
  label.slider{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; }
  input[type=range]{ width:200px; }
  .legend{ margin-left:auto; color:var(--muted); font-size:12.5px; }
  .legend b{ color:var(--ink); }
  .note{ color:var(--muted); font-size:12.5px; margin:0 0 8px; }

  .side{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  .side.mobile{ grid-template-columns:1fr 1fr; max-width:980px; }
  .col{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .col h3{ margin:0; padding:11px 16px; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .col h3 .tag{ color:var(--accent); }
  .col img{ display:block; width:100%; height:auto; }

  .overlay{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:0 auto; }
  .overlay img{ display:block; width:100%; height:auto; }
  .overlay .top{ position:absolute; inset:0; }
  .single{ max-width:760px; }
  .single.m{ max-width:430px; }
</style>
</head>
<body>
<header>
  <h1>Porównanie 1:1 — Figma ↔ please-support-me.com</h1>
  <div class="sub">Lewa/spód = projekt Figma · Prawa/wierzch = wersja live. Każdy ekran w wersji desktop i mobile. Wygenerowano z Figma MCP + Playwright.</div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="wrap" id="wrap"></div>

<script>
const SCREENS = [
  {
    id:'home', label:'🏠 Strona główna',
    desktop:{ figma:'/img/compare/figma-desktop.png', live:'/img/compare/live-desktop.png', fdim:'1336×3815', ldim:'1336×3778' },
    mobile:{ figma:'/img/compare/figma-mobile.png', live:'/img/compare/live-mobile.png', fdim:'402×5754', ldim:'402×…' },
  },
  {
    id:'cat', label:'📂 Kategoria (parafie)',
    note:'Brak osobnej ramki w Figmie — zaprojektowane spójnie z systemem marki. Klik kafelka „Kogo wspieramy?" → lista parafii.',
    desktop:{ live:'/img/compare/cat-desktop.png', ldim:'1336×…' },
    mobile:{ live:'/img/compare/cat-mobile.png', ldim:'402×…' },
  },
  {
    id:'praca', label:'💼 Praca / Rekrutacja',
    note:'Ramka REKRUTACJA w Figmie jest niedokończona (pasek „Pracuj z nami!" + duże koło; poniżej pusto). Pasek i koło odwzorowane 1:1; oferty pracy i formularz aplikacyjny dorobione spójnie z systemem marki.',
    desktop:{ figma:'/img/compare/praca-figma-d.png', live:'/img/compare/praca-live-d.png', fdim:'1336×3815', ldim:'1336×3939' },
    mobile:{ figma:'/img/compare/praca-figma-m.png', live:'/img/compare/praca-live-m.png', fdim:'402×5754', ldim:'402×…' },
  },
  {
    id:'product', label:'⛪ Parafia (cyfrowa taca)',
    note:'Brak osobnej ramki w Figmie — strona wpłaty zaprojektowana spójnie z systemem marki (presety kwot + dowolna kwota).',
    desktop:{ live:'/img/compare/product-live-d.png', ldim:'1336×1782' },
    mobile:{ live:'/img/compare/product-live-m.png', ldim:'402×2229' },
  },
];

function colHTML(side){
  let h='';
  if(side.figma) h+=`<div class="col"><h3>Figma <span class="tag">projekt</span></h3><img src="${side.figma}" loading="lazy"></div>`;
  h+=`<div class="col"><h3>Live <span class="tag">please-support-me.com</span></h3><img src="${side.live}" loading="lazy"></div>`;
  return h;
}
function blockHTML(title, side, isMobile){
  if(!side || !side.live) return '';
  const hasFigma = !!side.figma;
  const legend = `<div class="legend">${side.fdim?`Figma <b>${side.fdim}</b> · `:''}Live <b>${side.ldim||''}</b></div>`;
  const tools = hasFigma ? `
    <div class="toolbar">
      <div class="seg"><button class="active" data-m="side">Obok siebie</button><button data-m="overlay">Nakładka</button></div>
      <label class="slider" data-only="overlay" hidden>Krycie live <input type="range" min="0" max="100" value="55"><span class="ov">55%</span></label>
      ${legend}
    </div>` : `<div class="toolbar">${legend}</div>`;
  const side_div = `<div class="side ${isMobile?'mobile':''}" data-side>${colHTML(side)}</div>`;
  const overlay_div = hasFigma ? `<div class="overlay ${isMobile?'single m':'single'}" data-overlay style="display:none">
      <img src="${side.figma}"><div class="top"><img src="${side.live}" style="opacity:.55"></div></div>` : '';
  return `<div class="block"><h2>${title}</h2>${tools}${side_div}${overlay_div}</div>`;
}

const tabs=document.getElementById('tabs'), wrap=document.getElementById('wrap');
SCREENS.forEach((s,i)=>{
  const t=document.createElement('button'); t.className='tab'+(i?'':' active'); t.textContent=s.label;
  t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); document.getElementById('sc-'+s.id).classList.add('active'); };
  tabs.appendChild(t);
  const sec=document.createElement('section'); sec.className='screen'+(i?'':' active'); sec.id='sc-'+s.id;
  sec.innerHTML = (s.note?`<p class="note">ℹ️ ${s.note}</p>`:'')
    + blockHTML('Desktop', s.desktop, false)
    + blockHTML('Mobile', s.mobile, true);
  wrap.appendChild(sec);
});

// wire mode toggles + opacity (per block)
document.querySelectorAll('.block').forEach(b=>{
  const seg=b.querySelector('.seg'); if(!seg) return;
  const side=b.querySelector('[data-side]'), ov=b.querySelector('[data-overlay]'), lbl=b.querySelector('label[data-only]');
  seg.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('active')); btn.classList.add('active');
    const m=btn.dataset.m; side.style.display=m==='side'?'grid':'none'; ov.style.display=m==='overlay'?'block':'none';
    if(lbl) lbl.hidden=m!=='overlay';
  });
  const r=b.querySelector('input[type=range]');
  if(r) r.oninput=()=>{ ov.querySelector('.top img').style.opacity=r.value/100; b.querySelector('.ov').textContent=r.value+'%'; };
});
</script>
</body>
</html>
