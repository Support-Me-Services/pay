name: Efemeryczne środowisko testowe (GCP)

# Faza 7 — push na feature-branch stawia cały stos (Laravel + api-gateway +
# core-svc + Keycloak + bazy) na współdzielonym klastrze GKE Autopilot,
# każdy branch we własnym namespace. CronJob `housekeeper` wewnątrz klastra
# (patrz k8s/housekeeper/) kasuje namespace po jego TTL (domyślnie 1h,
# parametryzowalne przez "[ttl=Nh]" w commit message, 1-24h — patrz krok
# "Namespace + etykiety TTL" niżej) — ten workflow NIE ma własnego
# harmonogramu sprzątania, tylko szybką ścieżkę na zamknięcie PR-a (drugi
# job niżej), żeby nie czekać do TTL jeśli test skończył się wcześniej.
#
# Wymaga jednorazowego setupu GCP opisanego w k8s/README.md (klaster
# pay-ephemeral, Artifact Registry, Workload Identity Federation) — patrz
# tam po szczegóły sekretów GCP_WORKLOAD_IDENTITY_PROVIDER/GCP_SERVICE_ACCOUNT
# użytych niżej.

on:
  push:
    branches: ["feature/**"]
  pull_request:
    types: [closed]

env:
  PROJECT_ID: please-support-me-test1
  REGION: europe-central2
  CLUSTER: pay-ephemeral
  REGISTRY: europe-central2-docker.pkg.dev/please-support-me-test1/pay

permissions:
  contents: read
  id-token: write # Workload Identity Federation (bez klucza JSON)
  pull-requests: write # komentarz z URL-ami na PR-ze

jobs:
  teardown-on-close:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Wylicz namespace brancha
        id: ns
        run: echo "name=pay-eph-$(echo '${{ github.event.pull_request.head.ref }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//;s/-*$//' | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: pay-ephemeral
          location: europe-central2

      - name: Skasuj namespace natychmiast (PR zamknięty/zmergowany)
        run: kubectl delete namespace "${{ steps.ns.outputs.name }}" --ignore-not-found

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      # Drugi push na ten sam branch anuluje poprzedni, jeszcze trwający
      # deploy tego samego brancha — inaczej dwa równoległe joby walczyłyby
      # o ten sam namespace.
      group: pay-ephemeral-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Wylicz namespace brancha
        id: ns
        run: echo "name=pay-eph-$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//;s/-*$//' | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: pay-ephemeral
          location: europe-central2

      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      # --- budowa i push 3 obrazów, tag = SHA commita ---
      - uses: docker/setup-buildx-action@v3

      - name: Zbuduj i wypchnij obraz Laravela
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ci
          push: true
          tags: ${{ env.REGISTRY }}/laravel:${{ github.sha }}
          cache-from: type=gha,scope=laravel
          cache-to: type=gha,mode=max,scope=laravel

      - name: Zbuduj i wypchnij obraz core-svc
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/core-svc/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/core-svc:${{ github.sha }}
          cache-from: type=gha,scope=core-svc
          cache-to: type=gha,mode=max,scope=core-svc

      - name: Zbuduj i wypchnij obraz api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api-gateway:${{ github.sha }}
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway

      # --- namespace + sekret admina Keycloaka (losowy, NIE "admin"/"admin" —
      # środowisko jest publiczne przez godzinę). Ingress GKE potrafi
      # zostawić po sobie WOLNO znikające finalizery (ingress-finalizer-V2,
      # neg-finalizer) — kasowanie poprzedniego namespace'u (housekeeper po
      # godzinie, albo redeploy tego samego brancha) może więc jeszcze
      # trwać, gdy ten krok próbuje utworzyć namespace od nowa ("unable to
      # create new content ... namespace is being terminated"). Czekamy,
      # zamiast od razu próbować. ---
      # TTL parametryzowalny przez commit message: dopisz "[ttl=Nh]" (np.
      # "[ttl=6h]"), żeby środowisko żyło dłużej niż domyślną 1 godzinę —
      # nic nie trzeba klikać w GitHub, wystarczy sam tekst commita.
      # Zaciśnięte do 1-24h (świadomie: dłużej = realny, rosnący koszt
      # bez pilnowania, patrz rozmowa o kwotach/kosztach wyżej w sesji).
      # Wartość ląduje w adnotacji pay/ttl-seconds, którą czyta
      # housekeeper (k8s/housekeeper/02-cronjob.yaml) zamiast sztywnej
      # stałej 3600 wpisanej w skrypt.
      - name: Namespace + etykiety TTL (housekeeper czyta pay/created-at, pay/ttl-seconds)
        id: ttl
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NS="${{ steps.ns.outputs.name }}"
          for i in $(seq 1 60); do
            kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null | grep -q Terminating || break
            echo "Poprzedni namespace $NS wciąż się kasuje (finalizery Ingressa), czekam 10s..."
            sleep 10
          done
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$NS" pay/ephemeral=true --overwrite
          kubectl annotate namespace "$NS" pay/created-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite

          # `|| true` konieczne pod `set -e`: gdy w commit message nie ma [ttl=Nh]
          # (zwykły, domyślny przypadek), ostatni grep w potoku nie znajduje nic i
          # zwraca 1 — bez tego cały krok padał na KAŻDYM pushu bez tagu TTL
          # (złapane na żywo: pierwszy prawdziwy test tego kodu po zmergowaniu).
          TTL_HOURS=$(echo "$COMMIT_MSG" | grep -oE '\[ttl=[0-9]+h\]' | head -1 | grep -oE '[0-9]+' || true)
          TTL_HOURS="${TTL_HOURS:-1}"
          [ "$TTL_HOURS" -lt 1 ] && TTL_HOURS=1
          [ "$TTL_HOURS" -gt 24 ] && TTL_HOURS=24
          TTL_SECONDS=$((TTL_HOURS * 3600))
          echo "TTL tego środowiska: ${TTL_HOURS}h (${TTL_SECONDS}s)"
          echo "ttl_hours=${TTL_HOURS}" >> "$GITHUB_OUTPUT"
          kubectl annotate namespace "$NS" pay/ttl-seconds="$TTL_SECONDS" --overwrite

      - name: Sekret hasła admina Keycloaka (nowy losowy przy każdym deployu)
        run: |
          NS="${{ steps.ns.outputs.name }}"
          kubectl create secret generic keycloak-admin -n "$NS" \
            --from-literal=password="$(openssl rand -hex 16)" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Ingress (Faza 7 v2, patrz ingress.yaml) wymaga, żeby Secret
      # `ephemeral-tls` ISTNIAŁ już w momencie apply — treść na razie
      # nieważna (byle CN), prawdziwy certyfikat (z poprawnymi SAN-ami)
      # dogrywamy w kroku "Czekaj na Ingress...", gdy poznamy realny IP.
      - name: Placeholder Secret TLS (Ingress wymaga go PRZED apply)
        run: |
          NS="${{ steps.ns.outputs.name }}"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/placeholder.key -out /tmp/placeholder.crt -subj "/CN=placeholder"
          kubectl create secret tls ephemeral-tls -n "$NS" \
            --cert=/tmp/placeholder.crt --key=/tmp/placeholder.key \
            --dry-run=client -o yaml | kubectl apply -f -

      # --- render nakładki ephemeral z realnym namespace/tagami obrazów,
      # potem apply. --load-restrictor=LoadRestrictionsNone: k8s/overlays/
      # ephemeral celowo odwołuje się do już istniejących k8s/*.yaml (zero
      # duplikacji manifestów lokalnych), co domyślne, bardziej restrykcyjne
      # `kubectl apply -k` by zablokowało (patrz k8s/README.md). ---
      - name: Render + apply (kustomize)
        run: |
          NS="${{ steps.ns.outputs.name }}"
          SHA="${{ github.sha }}"
          sed -i "s/pay-ephemeral-placeholder/${NS}/" k8s/overlays/ephemeral/kustomization.yaml
          sed -i "s/newTag: ci-placeholder/newTag: ${SHA}/" k8s/overlays/ephemeral/kustomization.yaml
          kustomize build --load-restrictor=LoadRestrictionsNone k8s/overlays/ephemeral | kubectl apply -f -

      # --- Ingress GKE (klasa gce) potrafi potrzebować NAPRAWDĘ dużo czasu
      # na pierwsze wystawienie (tworzy prawdziwy load balancer HTTP(S):
      # forwarding rule, target proxy, backend services, health checki —
      # wolniejsze niż zwykły Service LoadBalancer L4, stąd hojny timeout
      # 15 minut, nie kilka jak dla zwykłego LB). Po poznaniu IP:
      # generujemy PRAWDZIWY certyfikat self-signed z SAN-ami dla
      # wszystkich 3 subdomen sslip.io i podmieniamy Secret + reguły hosta
      # w Ingressie (te w ingress.yaml to tylko placeholdery — realny host
      # zależy od IP, poznajemy go dopiero teraz). ---
      - name: Czekaj na Ingress i wygeneruj certyfikat
        id: ingress
        run: |
          set -o pipefail
          NS="${{ steps.ns.outputs.name }}"
          IP=""
          for i in $(seq 1 90); do
            IP=$(kubectl get ingress ephemeral -n "$NS" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$IP" ] && break
            sleep 10
          done
          [ -n "$IP" ] || { echo "Ingress nie dostał zewnętrznego IP w 15 minut"; kubectl describe ingress ephemeral -n "$NS"; exit 1; }
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          BASE="$(echo "$IP" | tr '.' '-').sslip.io"
          LARAVEL_HOST="laravel.${BASE}"
          KEYCLOAK_HOST="keycloak.${BASE}"
          API_HOST="api.${BASE}"
          echo "laravel_host=$LARAVEL_HOST" >> "$GITHUB_OUTPUT"
          echo "keycloak_host=$KEYCLOAK_HOST" >> "$GITHUB_OUTPUT"
          echo "api_host=$API_HOST" >> "$GITHUB_OUTPUT"

          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/ephemeral.key -out /tmp/ephemeral.crt -subj "/CN=${LARAVEL_HOST}" \
            -addext "subjectAltName=DNS:${LARAVEL_HOST},DNS:${KEYCLOAK_HOST},DNS:${API_HOST}"
          kubectl create secret tls ephemeral-tls -n "$NS" \
            --cert=/tmp/ephemeral.crt --key=/tmp/ephemeral.key \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl patch ingress ephemeral -n "$NS" --type=json -p="[
            {\"op\":\"replace\",\"path\":\"/spec/tls/0/hosts\",\"value\":[\"${LARAVEL_HOST}\",\"${KEYCLOAK_HOST}\",\"${API_HOST}\"]},
            {\"op\":\"replace\",\"path\":\"/spec/rules/0/host\",\"value\":\"${LARAVEL_HOST}\"},
            {\"op\":\"replace\",\"path\":\"/spec/rules/1/host\",\"value\":\"${KEYCLOAK_HOST}\"},
            {\"op\":\"replace\",\"path\":\"/spec/rules/2/host\",\"value\":\"${API_HOST}\"}
          ]"

      # --- Keycloak: czekaj na rollout, ustaw KC_HOSTNAME na prawdziwy
      # adres HTTPS (Ingress kończy TLS, do poda leci już zwykłe HTTP —
      # stąd https:// w KC_HOSTNAME mimo braku TLS na samym podie, i
      # KC_PROXY_HEADERS=xforwarded w manifeście, żeby Keycloak zaufał
      # nagłówkowi od Ingressa). Timeout 600s — patrz komentarz o świeżym
      # klastrze Autopilot i nowych node poolach w poprzedniej wersji tego
      # kroku (git blame). ---
      - name: Czekaj na Keycloak i ustaw KC_HOSTNAME
        id: keycloak
        run: |
          NS="${{ steps.ns.outputs.name }}"
          kubectl rollout status deployment/keycloak -n "$NS" --timeout=600s
          kubectl set env deployment/keycloak -n "$NS" -c keycloak KC_HOSTNAME="https://${{ steps.ingress.outputs.keycloak_host }}"
          kubectl rollout status deployment/keycloak -n "$NS" --timeout=300s

      # --- świeży import realmu maskuje sekrety klientów w eksporcie (znany
      # problem z Fazy 6) — pobierz PRAWDZIWE sekrety z Admin API ---
      # Token admina Keycloaka żyje tylko 60s (expires_in) — NIE przekazujemy
      # go dalej jako output (krok "Zarejestruj redirect URI" dzieli od
      # tego miejsca kilka minut — loguje się więc na świeżo, osobno).
      # set -o pipefail + jawna walidacja TOKEN/ID/SECRET — bez tego
      # `curl -f` na błędzie HTTP + `jq` na pustym wejściu ciche przechodzą
      # dalej z pustym wynikiem zamiast przerwać skrypt.
      #
      # Admin API WYŁĄCZNIE przez `kubectl port-forward` (localhost), NIE
      # przez zewnętrzny LoadBalancer IP: realm `master` (wbudowany,
      # nie ma go w pay-realm.json — w przeciwieństwie do realmu `pay`,
      # który już ma sslRequired=none) wymusza HTTPS dla ruchu z adresów
      # ZEWNĘTRZNYCH ("HTTPS required", HTTP 403) — nasz runner łączący
      # się przez publiczny IP LoadBalancera jest z perspektywy Keycloaka
      # ruchem zewnętrznym. Ruch przez port-forward (proxy przez API
      # Kubernetesa) Keycloak widzi jako lokalny/wewnętrzny, więc ten
      # wymóg go nie dotyczy. Realnych użytkowników w przeglądarce to NIE
      # dotyczy — logują się do realmu `pay`, nie `master`.
      - name: Pobierz sekrety klientów Keycloaka
        id: kc-secrets
        run: |
          set -o pipefail
          NS="${{ steps.ns.outputs.name }}"
          PF_LOG=$(mktemp)
          start_pf() {
            kubectl port-forward -n "$NS" svc/keycloak 18180:8080 > "$PF_LOG" 2>&1 &
            PF_PID=$!
          }
          start_pf
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          # Czekaj na FAKTYCZNE ustanowienie tunelu (nie ślepy sleep) — bez
          # tego pierwsze próby curl trafiają w jeszcze niegotowy tunel,
          # dostają "connection refused", i (bez set -o pipefail na TYM
          # etapie budowy tunelu) nie sposób odróżnić tego od "Keycloak
          # jeszcze nie gotowy" — złapane, gdy ręczny test tym samym
          # poleceniem zawsze się udawał, a przebieg CI zawsze padał przez
          # całe okno retry.
          for i in $(seq 1 10); do
            grep -q "Forwarding from" "$PF_LOG" 2>/dev/null && break
            sleep 1
          done
          KC="http://localhost:18180"
          ADMIN_PW=$(kubectl get secret keycloak-admin -n "$NS" -o jsonpath='{.data.password}' | base64 -d)
          TOKEN=""
          for i in $(seq 1 24); do
            kill -0 "$PF_PID" 2>/dev/null || { echo "port-forward padł, restartuję..."; start_pf; sleep 2; }
            TOKEN=$(curl -sf -X POST "${KC}/realms/master/protocol/openid-connect/token" \
              -d "username=admin&password=${ADMIN_PW}&grant_type=password&client_id=admin-cli" | jq -r .access_token) && [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] && break
            echo "Keycloak admin jeszcze nie gotowy do logowania, ponawiam za 10s..."
            sleep 10
          done
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Nie udało się zalogować do Keycloaka po 240s. Log port-forward:"
            cat "$PF_LOG"
            exit 1
          fi
          for CLIENT in laravel-panel-gateway laravel-panel-storefront; do
            ID=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
              "${KC}/admin/realms/pay/clients?clientId=${CLIENT}" | jq -r '.[0].id')
            [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "Brak klienta ${CLIENT} w realmie"; exit 1; }
            SECRET=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
              "${KC}/admin/realms/pay/clients/${ID}/client-secret" | jq -r .value)
            [ -n "$SECRET" ] && [ "$SECRET" != "null" ] || { echo "Nie udało się pobrać sekretu klienta ${CLIENT}"; exit 1; }
            echo "::add-mask::${SECRET}"
            VAR=$(echo "$CLIENT" | tr '[:lower:]-' '[:upper:]_')
            echo "${VAR}_ID=${ID}" >> "$GITHUB_OUTPUT"
            echo "${VAR}_SECRET=${SECRET}" >> "$GITHUB_OUTPUT"
          done

      # --- api-gateway/core-svc już zaaplikowane wyżej (JWKS URI zawsze
      # wewnątrzklastrowy, nie zależy od zewnętrznych IP) — tylko czekamy ---
      - name: Czekaj na core-svc i api-gateway
        run: |
          NS="${{ steps.ns.outputs.name }}"
          kubectl rollout status deployment/core-svc -n "$NS" --timeout=600s
          kubectl rollout status deployment/api-gateway -n "$NS" --timeout=600s

      # --- Laravel: dogrywamy prawdziwy URL Keycloaka + sekrety klientów.
      # Zewnętrzny adres to teraz WSPÓLNY Ingress (poznany w kroku
      # "Czekaj na Ingress...") — Laravel nie ma już własnego LB/IP. ---
      # -c laravel: BEZ jawnego wskazania kontenera, `kubectl set env` na
      # tym Deploymencie trafiał w initContainer (wait-for-db), nie w
      # główny kontener aplikacji — logowanie kończyło się redirectem na
      # dosłowny tekst placeholdera zamiast prawdziwego URL-a Keycloaka
      # (złapane w przeglądarce: przycisk "Zaloguj przez Keycloak" dawał
      # 404, bo Location: nie był prawidłowym URL-em). Ten sam problem
      # naprawiony analogicznie w kroku "Czekaj na Keycloak" (-c keycloak).
      - name: Ustaw config Keycloaka na Laravelu
        run: |
          NS="${{ steps.ns.outputs.name }}"
          kubectl set env deployment/laravel-app -n "$NS" -c laravel \
            KEYCLOAK_BASE_URL="https://${{ steps.ingress.outputs.keycloak_host }}" \
            KEYCLOAK_CLIENT_SECRET_GATEWAY="${{ steps.kc-secrets.outputs.LARAVEL_PANEL_GATEWAY_SECRET }}" \
            KEYCLOAK_CLIENT_SECRET_STOREFRONT="${{ steps.kc-secrets.outputs.LARAVEL_PANEL_STOREFRONT_SECRET }}"
          kubectl rollout status deployment/laravel-app -n "$NS" --timeout=600s

      # --- dopisz adres Laravela do dozwolonych redirect URI obu klientów.
      # PUT nadpisuje całą reprezentację klienta, więc najpierw GET i
      # DOPISUJEMY do istniejącej listy (nie kasujemy localhost/prod). ---
      - name: Zarejestruj redirect URI Laravela w Keycloaku
        run: |
          set -o pipefail
          NS="${{ steps.ns.outputs.name }}"
          LARAVEL_HOST="${{ steps.ingress.outputs.laravel_host }}"
          # Admin API przez port-forward (localhost), nie zewnętrzny Ingress —
          # patrz komentarz przy kroku "Pobierz sekrety klientów Keycloaka"
          # (realm master wymusza HTTPS dla ruchu zewnętrznego). Czekamy na
          # faktyczne ustanowienie tunelu, nie ślepy sleep — patrz tamten
          # sam komentarz o przyczynie.
          PF_LOG=$(mktemp)
          kubectl port-forward -n "$NS" svc/keycloak 18180:8080 > "$PF_LOG" 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 10); do
            grep -q "Forwarding from" "$PF_LOG" 2>/dev/null && break
            sleep 1
          done
          KC="http://localhost:18180"
          # Świeże logowanie — token admina żyje tylko 60s, ten z kroku
          # "Pobierz sekrety" (kilka minut wcześniej) już dawno wygasł.
          ADMIN_PW=$(kubectl get secret keycloak-admin -n "$NS" -o jsonpath='{.data.password}' | base64 -d)
          TOKEN=$(curl -sf -X POST "${KC}/realms/master/protocol/openid-connect/token" \
            -d "username=admin&password=${ADMIN_PW}&grant_type=password&client_id=admin-cli" | jq -r .access_token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "Nie udało się zalogować do Keycloaka"; exit 1; }
          for PAIR in "LARAVEL_PANEL_GATEWAY:${{ steps.kc-secrets.outputs.LARAVEL_PANEL_GATEWAY_ID }}" \
                      "LARAVEL_PANEL_STOREFRONT:${{ steps.kc-secrets.outputs.LARAVEL_PANEL_STOREFRONT_ID }}"; do
            ID="${PAIR#*:}"
            CLIENT=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
              "${KC}/admin/realms/pay/clients/${ID}")
            UPDATED=$(echo "$CLIENT" | jq \
              --arg cb "https://${LARAVEL_HOST}/panel/auth/callback" \
              --arg lo "https://${LARAVEL_HOST}/panel/login" \
              --arg wo "https://${LARAVEL_HOST}" \
              '.redirectUris += [$cb] | ."attributes"."post.logout.redirect.uris" += ("+" + $lo) | .webOrigins += [$wo]')
            curl -sf -X PUT -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              -d "$UPDATED" "${KC}/admin/realms/pay/clients/${ID}" >/dev/null
          done

      # --- Sprawdź, że Ingress FAKTYCZNIE routuje (nie tylko "ma IP") —
      # health check GKE dla podów bez zdrowej sondy potrafi wiecznie
      # 502-ować mimo poprawnie wdrożonych podów (patrz readinessProbe
      # /realms/master dodany do k8s/12-keycloak.yaml właśnie z tego
      # powodu). -k: self-signed cert, nie ma się czym przejmować tutaj. ---
      - name: Zweryfikuj routing Ingressa
        run: |
          IP="${{ steps.ingress.outputs.ip }}"
          for HOST in "${{ steps.ingress.outputs.laravel_host }}" "${{ steps.ingress.outputs.keycloak_host }}" "${{ steps.ingress.outputs.api_host }}"; do
            OK=""
            for i in $(seq 1 30); do
              CODE=$(curl -sk -o /dev/null -w "%{http_code}" --resolve "${HOST}:443:${IP}" "https://${HOST}/" --max-time 10 || true)
              case "$CODE" in
                200|301|302|401|403) OK=1; break ;;
              esac
              echo "Ingress jeszcze nie routuje do ${HOST} (HTTP ${CODE:-brak}), ponawiam za 10s..."
              sleep 10
            done
            [ -n "$OK" ] || { echo "Ingress nie zaczął routować do ${HOST} w 5 minut"; exit 1; }
          done

      - name: Podsumowanie
        run: |
          {
            echo "## Efemeryczne środowisko testowe — \`${{ github.ref_name }}\`"
            echo ""
            echo "Zniknie automatycznie po ${{ steps.ttl.outputs.ttl_hours }}h (albo przy zamknięciu PR-a). Dłużej? Dopisz \`[ttl=Nh]\` (1-24) w commit message i wypchnij ponownie."
            echo ""
            echo "| Usługa | Adres |"
            echo "|---|---|"
            echo "| Laravel (Storefront/panel) | https://${{ steps.ingress.outputs.laravel_host }} |"
            echo "| api-gateway | https://${{ steps.ingress.outputs.api_host }} |"
            echo "| Keycloak (login/admin) | https://${{ steps.ingress.outputs.keycloak_host }} |"
            echo ""
            echo "Certyfikat jest self-signed (środowisko testowe) — przeglądarka pokaże"
            echo "ostrzeżenie \"połączenie nie jest prywatne\", kliknij Zaawansowane →"
            echo "Przejdź do strony. Login admina Keycloaka: \`admin\` / (patrz Secret"
            echo "\`keycloak-admin\` w namespace \`${{ steps.ns.outputs.name }}\`)."
            echo ""
            echo "_Uwaga: efemeryczne środowisko testuje wyłącznie tenant Storefront — patrz k8s/README.md._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Komentarz na PR (jeśli istnieje otwarty PR dla tego brancha)
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref_name}`, state: "open",
            });
            if (prs.data.length === 0) return;
            const body = [
              `**Efemeryczne środowisko testowe gotowe** (zniknie po ${{ steps.ttl.outputs.ttl_hours }}h, cert self-signed — "Zaawansowane → Przejdź do strony"; dłużej? dopisz [ttl=Nh] w commit message i wypchnij ponownie):`,
              `- Laravel: https://${{ steps.ingress.outputs.laravel_host }}`,
              `- api-gateway: https://${{ steps.ingress.outputs.api_host }}`,
              `- Keycloak: https://${{ steps.ingress.outputs.keycloak_host }}`,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prs.data[0].number, body,
            });
