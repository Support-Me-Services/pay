# Odpowiednik cms-svc w ecosystem/docker-compose.yml — mirror 20-core-svc.yaml.
# Obraz budowany lokalnie (docker compose build cms-svc w ecosystem/) — ten
# sam Docker, więc od razu widoczny klastrowi, bez rejestru.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-svc
  namespace: pay
spec:
  replicas: 1
  selector:
    matchLabels: { app: cms-svc }
  template:
    metadata:
      labels: { app: cms-svc }
    spec:
      initContainers:
        - name: wait-for-postgres-cms
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-cms 5432; do echo waiting...; sleep 2; done"]
      containers:
        - name: cms-svc
          image: ecosystem_cms-svc:latest
          imagePullPolicy: Never
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres-cms:5432/cms_svc" }
            - { name: SPRING_DATASOURCE_USERNAME, value: cms_svc }
            - { name: SPRING_DATASOURCE_PASSWORD, value: cms_svc }
          ports:
            - { containerPort: 8083 }
            - { containerPort: 9093 }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cms-svc
  namespace: pay
spec:
  type: LoadBalancer
  selector: { app: cms-svc }
  ports:
    - { name: rest, port: 8083, targetPort: 8083 }
    - { name: grpc, port: 9093, targetPort: 9093 }
