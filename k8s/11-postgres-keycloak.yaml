# Baza Keycloaka — odpowiednik postgres-keycloak. ClusterIP (nie było
# wpisu "ports:" w docker-compose — nigdy nie było dostępne z hosta).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-keycloak-data
  namespace: pay
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-keycloak
  namespace: pay
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-keycloak }
  template:
    metadata:
      labels: { app: postgres-keycloak }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: keycloak }
            - { name: POSTGRES_USER, value: keycloak }
            - { name: POSTGRES_PASSWORD, value: keycloak }
            # Podkatalog, NIE korzeń wolumenu — patrz identyczny komentarz
            # w k8s/10-postgres-core.yaml (lost+found na dyskach PD w chmurze).
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            periodSeconds: 5
            failureThreshold: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-keycloak-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-keycloak
  namespace: pay
spec:
  selector: { app: postgres-keycloak }
  ports:
    - { port: 5432, targetPort: 5432 }
