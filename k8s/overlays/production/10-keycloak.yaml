# Produkcja (support-me-prod) — Keycloak z sidecarem Cloud SQL Auth Proxy do
# keycloak-db. Keycloak zarządza własnym schematem (wbudowany Liquibase) —
# nic do zrobienia z naszej strony poza podaniem connection stringa.
# Faza 8.2 — tylko ruch wewnętrzny, start-dev + import realmu z lokalnego PoC
# (Faza 3); przejście na `start` (tryb produkcyjny, nie -dev) i realny content
# realmu to osobny krok przed publicznym cutoverem (Faza 8.5).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      serviceAccountName: pay-workload
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://127.0.0.1:5432/keycloak
            - name: KC_PROXY_HEADERS
              # GKE Ingress kończy TLS i przekazuje dalej zwykłe HTTP — bez
              # tego Keycloak nie wie, że oryginalne żądanie było HTTPS, i
              # generuje issuer/redirect URL-e z http:// zamiast https://
              # (złapane na żywo: openid-configuration pokazywał "issuer":
              # "http://keycloak.please-support-me.eu/realms/pay").
              value: xforwarded
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
            - name: KC_HEALTH_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 800m
              memory: 1536Mi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          args:
            - "--private-ip"
            - "--port=5432"
            - "support-me-prod:europe-central2:keycloak-db"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
