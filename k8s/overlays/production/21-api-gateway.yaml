# Produkcja (support-me-prod) — api-gateway, bezstanowy, bez własnej bazy.
# Faza 8.2 — tylko ruch syntetyczny/wewnętrzny, zero publicznego DNS na razie.
# Keycloak i gateway-svc (Laravel) jeszcze nie wdrożone w tym projekcie —
# health check własny api-gateway nie zależy od nich (patrz notatki Fazy 0).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: europe-central2-docker.pkg.dev/support-me-prod/pay/api-gateway:v1
          ports:
            - containerPort: 8081
          env:
            - name: PAY_CORE_SVC_GRPC_HOST
              value: core-svc
            - name: PAY_CORE_SVC_GRPC_PORT
              value: "9090"
            - name: PAY_GATEWAY_SVC_GRPC_HOST
              value: laravel
            - name: PAY_GATEWAY_SVC_GRPC_PORT
              value: "9091"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
