# Odpowiednik api-gateway. Kluczowa różnica względem ecosystem/docker-compose.yml:
# gateway-svc (Laravel) żył w OSOBNYM projekcie docker-compose, więc trzeba
# było celować w host.docker.internal. Tu wszystko jest w jednym namespace
# "pay" — Laravel to zwykła usługa klastra ("laravel-app"), żadnej sztuczki.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: pay
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ecosystem_api-gateway:latest
          imagePullPolicy: Never
          env:
            - { name: PAY_CORE_SVC_GRPC_HOST, value: core-svc }
            - { name: PAY_CORE_SVC_GRPC_PORT, value: "9090" }
            - { name: PAY_CMS_SVC_GRPC_HOST, value: cms-svc }
            - { name: PAY_CMS_SVC_GRPC_PORT, value: "9093" }
            - { name: PAY_GATEWAY_SVC_GRPC_HOST, value: laravel-app }
            - { name: PAY_GATEWAY_SVC_GRPC_PORT, value: "9091" }
            - { name: PAY_KEYCLOAK_JWK_SET_URI, value: "http://keycloak:8080/realms/pay/protocol/openid-connect/certs" }
          ports:
            - { containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: pay
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports:
    - { port: 8081, targetPort: 8081 }
