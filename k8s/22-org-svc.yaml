# Odpowiednik org-svc w ecosystem/docker-compose.yml. Obraz budowany
# lokalnie (docker compose build org-svc w ecosystem/) — ten sam Docker,
# więc od razu widoczny klastrowi, bez rejestru.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: org-svc
  namespace: pay
spec:
  replicas: 1
  selector:
    matchLabels: { app: org-svc }
  template:
    metadata:
      labels: { app: org-svc }
    spec:
      initContainers:
        - name: wait-for-postgres-org
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-org 5432; do echo waiting...; sleep 2; done"]
      containers:
        - name: org-svc
          image: ecosystem_org-svc:latest
          imagePullPolicy: Never
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres-org:5432/org_svc" }
            - { name: SPRING_DATASOURCE_USERNAME, value: org_svc }
            - { name: SPRING_DATASOURCE_PASSWORD, value: org_svc }
          ports:
            - { containerPort: 8083 }
            - { containerPort: 9092 }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: org-svc
  namespace: pay
spec:
  type: LoadBalancer
  selector: { app: org-svc }
  ports:
    - { name: rest, port: 8083, targetPort: 8083 }
    - { name: grpc, port: 9092, targetPort: 9092 }
