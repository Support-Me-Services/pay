# Co 5 minut kasuje namespace'y efemeryczne (etykieta pay/ephemeral=true)
# starsze niż godzinę (adnotacja pay/created-at, RFC3339 UTC) — patrz
# .github/workflows/ephemeral-env.yml, które ją ustawia/odświeża przy
# każdym (re)deployu brancha. Działa niezależnie od GitHub Actions (nawet
# przy jego awarii) — jedyna zależność to samo Kubernetes API.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: housekeeper
  namespace: pay-system
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: housekeeper
          restartPolicy: Never
          containers:
            - name: housekeeper
              # UWAGA (2026-09-05): tag `bitnami/kubectl:1.30` zniknął z Docker
              # Hub (Bitnami wycofało pinowane wersje) — housekeeper failował
              # cichcem przez ImagePullBackOff od nieznanego czasu, co
              # pozwoliło środowiskom efemerycznym żyć bez limitu (realny
              # koszt). `:latest` zweryfikowane jako działające (v1.37.0
              # klienta) — jeśli to też kiedyś zniknie/zmieni się w
              # nieoczekiwany sposób, sprawdź dostępne tagi przez
              # `curl -s https://hub.docker.com/v2/repositories/bitnami/kubectl/tags`
              # zanim przywrócisz pinowaną wersję.
              image: bitnami/kubectl:latest
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  NOW=$(date -u +%s)
                  kubectl get namespace -l pay/ephemeral=true \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.annotations.pay/created-at}{"\n"}{end}' \
                    | while IFS=$'\t' read -r NS CREATED; do
                        [ -z "$CREATED" ] && continue
                        CREATED_EPOCH=$(date -u -d "$CREATED" +%s) || continue
                        AGE=$(( NOW - CREATED_EPOCH ))
                        if [ "$AGE" -gt 3600 ]; then
                          echo "Kasuję namespace $NS (wiek: ${AGE}s > 3600s)"
                          kubectl delete namespace "$NS" --wait=false
                        else
                          echo "Zostawiam $NS (wiek: ${AGE}s)"
                        fi
                      done
