# Odpowiednik keycloak w ecosystem/docker-compose.yml. Realm "pay" +
# klient "web" odtwarzają się sami z pay-realm.json (--import-realm) —
# ten sam plik z repo, zamontowany przez hostPath zamiast bind-mount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: pay
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      initContainers:
        # Odpowiednik depends_on / condition: service_healthy w compose —
        # Kubernetes nie ma tego natywnie, czekamy ręcznie na port Postgresa.
        - name: wait-for-postgres-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-keycloak 5432; do echo waiting...; sleep 2; done"]
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres-keycloak:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - { name: KC_DB_PASSWORD, value: keycloak }
            - { name: KEYCLOAK_ADMIN, value: admin }
            - { name: KEYCLOAK_ADMIN_PASSWORD, value: admin }
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/pay-realm.json
              readOnly: true
      volumes:
        - name: realm
          hostPath:
            path: /run/desktop/mnt/host/c/Users/marci/git/pay/ecosystem/keycloak/pay-realm.json
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: pay
spec:
  type: LoadBalancer
  selector: { app: keycloak }
  ports:
    # 8080: tak api-gateway/inne pody łączą się wewnątrz klastra
    # (jwk-set-uri: http://keycloak:8080/..., bez zmian w konfiguracji).
    - { name: internal, port: 8080, targetPort: 8080 }
    # 8180: parytet z docker-compose (8180:8080) — konsola admina z hosta.
    - { name: host, port: 8180, targetPort: 8080 }
