databaseChangeLog:
  - changeSet:
      id: 003-create-job-positions
      author: cms-svc
      comment: Stanowiska pracy (sekcja "Praca") — zarządzane z panelu organizacji.
      changes:
        - createTable:
            tableName: job_positions
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: organization_id, type: bigint, constraints: { nullable: true, foreignKeyName: fk_job_positions_organization, references: organizations(id) } }
              - column: { name: title, type: varchar(255), constraints: { nullable: false } }
              - column: { name: location, type: varchar(255) }
              - column: { name: employment_type, type: varchar(255) }
              - column: { name: description_html, type: text }
              - column: { name: short_description, type: text }
              - column: { name: active, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: sort, type: integer, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: "timestamptz", defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            indexName: idx_job_positions_organization_id
            tableName: job_positions
            columns:
              - column: { name: organization_id }
