server:
  port: 8081

pay:
  core-svc:
    grpc-host: localhost
    grpc-port: 9090
  gateway-svc:
    # gateway-svc (Laravel/RoadRunner, PoC Fazy 1) żyje w OSOBNYM stacku
    # Dockera (docker/, nie ecosystem/) — patrz ecosystem/docker-compose.yml
    # dla nadpisania na host.docker.internal przy uruchomieniu w kontenerze.
    grpc-host: localhost
    grpc-port: 9091
  keycloak:
    # issuer = string zaszyty w tokenie (to, czego użyła przeglądarka) —
    # NIE zmienia się między local/docker. jwk-set-uri = jak TEN kontener
    # faktycznie dociąga klucze — patrz ecosystem/docker-compose.yml dla
    # nadpisania na keycloak:8080 przy uruchomieniu w kontenerze.
    issuer: http://localhost:8180/realms/pay
    jwk-set-uri: http://localhost:8180/realms/pay/protocol/openid-connect/certs
    audience: api-gateway
  storefront:
    # Allowlist hostów do budowy Location przy przekierowaniu skanu (Faza 5,
    # PublicInitController) — bez tego nagłówek Host od klienta trafiałby
    # wprost do odpowiedzi (open redirect). Te same 3 aliasy co
    # config('tenants.map') w Laravelu.
    allowed-hosts: localhost,please-support-me.com,stage.please-support-me.com
  internal:
    # Sekret dla /internal/v1/** (Faza 5) — WYŁĄCZNIE do lokalnej
    # weryfikacji, patrz InternalApiKeyFilter. W żadnym środowisku
    # współdzielonym nie zostawiać wartości domyślnej.
    api-key: local-dev-only-change-me

management:
  endpoints:
    web:
      exposure:
        include: health,info
