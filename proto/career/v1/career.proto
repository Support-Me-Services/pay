syntax = "proto3";

package pay.career.v1;

option java_multiple_files = true;
option java_package = "pay.career.v1";
option java_outer_classname = "CareerProto";

// Sekcja "Praca" — dwie silnie powiązane encje (job_position_id na
// JobApplication jest opcjonalne: NULL = aplikacja spontaniczna, ale MIMO
// TO ma właściciela przez organization_id, ustawiany niezależnie).
service JobPositionService {
  rpc Create(CreateJobPositionRequest) returns (JobPositionResponse);
  rpc Update(UpdateJobPositionRequest) returns (JobPositionResponse);
  rpc Delete(DeleteJobPositionRequest) returns (DeleteJobPositionResponse);
  rpc Get(GetJobPositionRequest) returns (JobPositionResponse);
  rpc ListByOrganization(ListJobPositionsRequest) returns (ListJobPositionsResponse);
}

service JobApplicationService {
  // Publiczne — formularz aplikacji na stronie kariery, bez auth.
  rpc Create(CreateJobApplicationRequest) returns (JobApplicationResponse);
  // Panelowe — zmiana statusu/oznaczenie jako przeczytane.
  rpc UpdateStatus(UpdateJobApplicationStatusRequest) returns (JobApplicationResponse);
  rpc Delete(DeleteJobApplicationRequest) returns (DeleteJobApplicationResponse);
  rpc ListByOrganization(ListJobApplicationsRequest) returns (ListJobApplicationsResponse);
}

message CreateJobPositionRequest {
  optional int64 organization_id = 1;
  string title = 2;
  optional string location = 3;
  optional string employment_type = 4;
  optional string description_html = 5;
  optional string short_description = 6;
  int32 sort = 7;
}

message UpdateJobPositionRequest {
  int64 id = 1;
  optional int64 organization_id = 2; // do weryfikacji własności
  string title = 3;
  optional string location = 4;
  optional string employment_type = 5;
  optional string description_html = 6;
  optional string short_description = 7;
  bool active = 8;
  int32 sort = 9;
}

message DeleteJobPositionRequest {
  int64 id = 1;
  optional int64 organization_id = 2;
}

message DeleteJobPositionResponse {
  bool deleted = 1;
}

message GetJobPositionRequest {
  int64 id = 1;
}

message ListJobPositionsRequest {
  optional int64 organization_id = 1;
  bool active_only = 2; // publiczna lista /praca chce tylko active=true
}

message ListJobPositionsResponse {
  repeated JobPositionResponse positions = 1;
}

message JobPositionResponse {
  int64 id = 1;
  optional int64 organization_id = 2;
  string title = 3;
  optional string location = 4;
  optional string employment_type = 5;
  optional string description_html = 6;
  optional string short_description = 7;
  bool active = 8;
  int32 sort = 9;
}

message CreateJobApplicationRequest {
  optional int64 job_position_id = 1; // unset = aplikacja spontaniczna
  optional int64 organization_id = 2; // właściciel — ustawiany niezależnie od job_position_id
  string name = 3;
  string email = 4;
  optional string phone = 5;
  optional string message = 6;
  optional string cv_path = 7;
  optional string cv_original_name = 8;
  bool future_recruitment_consent = 9;
}

message UpdateJobApplicationStatusRequest {
  int64 id = 1;
  optional int64 organization_id = 2; // do weryfikacji własności
  string status = 3; // pending | accepted | rejected
  bool is_read = 4;
}

message DeleteJobApplicationRequest {
  int64 id = 1;
  optional int64 organization_id = 2;
}

message DeleteJobApplicationResponse {
  bool deleted = 1;
}

message ListJobApplicationsRequest {
  optional int64 organization_id = 1;
}

message ListJobApplicationsResponse {
  repeated JobApplicationResponse applications = 1;
}

message JobApplicationResponse {
  int64 id = 1;
  optional int64 job_position_id = 2;
  optional int64 organization_id = 3;
  string name = 4;
  string email = 5;
  optional string phone = 6;
  optional string message = 7;
  optional string cv_path = 8;
  optional string cv_original_name = 9;
  bool is_read = 10;
  string status = 11;
  bool future_recruitment_consent = 12;
}
