syntax = "proto3";

package pay.health.v1;

option java_multiple_files = true;
option java_package = "pay.health.v1";
option java_outer_classname = "HealthProto";

// Pierwszy współdzielony kontrakt gRPC w ekosystemie — celowo trywialny.
// Cel: udowodnić cały łańcuch (proto -> wygenerowane klasy -> realne
// wywołanie sieciowe gRPC między api-gateway i core-svc), zanim popłynie
// przez niego jakakolwiek prawdziwa domena.
service HealthCheckService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  // Nazwa usługi wołającej — do logów/diagnostyki, nie do routingu.
  string caller = 1;
}

message HealthCheckResponse {
  enum Status {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }

  Status status = 1;
  string service_name = 2;
  string message = 3;
}
