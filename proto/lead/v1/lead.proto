syntax = "proto3";

package pay.lead.v1;

option java_multiple_files = true;
option java_package = "pay.lead.v1";
option java_outer_classname = "LeadProto";

// Leady ze strony lądowania Gatewaya — jeden globalny formularz kontaktowy,
// BEZ właściciela/organizacji (mirror 1:1 tabeli `leads` z Laravela).
// Celowo tylko Create+List — tabela jest płaska, nikt jej nie edytuje.
service LeadService {
  rpc Create(CreateLeadRequest) returns (LeadResponse);
  rpc List(ListLeadsRequest) returns (ListLeadsResponse);
}

message CreateLeadRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  optional string company = 4;
  string message = 5;
}

message ListLeadsRequest {
}

message ListLeadsResponse {
  repeated LeadResponse leads = 1;
}

message LeadResponse {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  optional string company = 5;
  string message = 6;
}
